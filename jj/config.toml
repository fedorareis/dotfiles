#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "fedorareis"
email = "fedorareis@gmail.com"

[ui]
color = "auto"
merge-editor = "weave"
editor = "vim"
# Use Difftastic by default
diff-formatter = ["difft", "--color=always", "$left", "$right"]
conflict-marker-style = "git"

[signing]
behavior = "own"
backend = "gpg"
## You can set `key` to anything accepted by `gpg -u`
## If not set then defaults to the key associated with `user.email`
key = "2DCE5D6359BEC47F"
# key = "signing@example.com"

[git]
private-commits = "description(glob:'wip:*') | description(glob:'private:*')"

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | (trunk().. & ~mine())"

[[--scope]]
--when.commands = ["status"]
[--scope.ui]
paginate = "never"

[remotes.origin]
auto-track-bookmarks = "*"

[merge-tools.weave]
program = "weave-driver"
merge-args = ["$base", "$left", "$right", "-o", "$output", "-l", "$marker_length", "-p", "$path"]
merge-conflict-exit-codes = [1]
merge-tool-edits-conflict-markers = true
conflict-marker-style = "git"

[aliases]
# `jj restack` to rebase your changes onto `trunk()`
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents"]
# `jj tidy` to remove all empty commits
tidy = ["abandon", "empty() & mutable() & ~merges() & mine() & ~@"]
